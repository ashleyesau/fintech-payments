name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      PGPASSWORD: sim

    steps:
      - uses: actions/checkout@v4

      # Same flags as docker-compose.yml. A service container cannot take server flags, and
      # the CDC tests need wal_level=logical (they fail without it). The wait uses -h
      # localhost because the image's start-up runs a temporary server on the socket only.
      - name: Start Postgres with logical decoding
        run: |
          docker run -d --name fintech_pg -p 5432:5432 \
            -e POSTGRES_USER=sim -e POSTGRES_PASSWORD=sim -e POSTGRES_DB=fintech \
            postgres:16 postgres \
            -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4 \
            -c max_slot_wal_keep_size=3GB
          for i in $(seq 1 30); do
            docker exec fintech_pg pg_isready -h localhost -U sim -d fintech && exit 0
            sleep 2
          done
          docker logs fintech_pg
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The Bronze pins (requirements.txt) have wheels for this runner or the install above fails. This
      # prints the versions that were installed, and fails if one of the four is missing.
      - name: Show the Bronze dependencies
        run: |
          pip freeze | grep -i -E '^(pyiceberg|pyiceberg[-_]core|pyarrow|sqlalchemy)=='
          test "$(pip freeze | grep -c -i -E '^(pyiceberg|pyiceberg[-_]core|pyarrow|sqlalchemy)==')" = 4

      - name: Apply migrations
        run: |
          psql -h localhost -U sim -d fintech -f migrations/001_initial_schema.sql
          psql -h localhost -U sim -d fintech -f migrations/002_loan_repayments_fk.sql
          psql -h localhost -U sim -d fintech -f migrations/003_loan_applications_replica_identity.sql

      # The full suite, slow tests included. Locally -m "not slow" skips them.
      - name: Run tests
        run: python -m pytest tests/ -q

  # Checks the dbt project: installs packages from dbt Hub, no BigQuery connection needed.
  # dbt debug (connection check) runs on the Air only; CI only validates that the project
  # structure is correct and packages resolve.
  dbt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dbt-bigquery
        run: pip install --default-timeout 100 "dbt-bigquery~=1.9.2"

      - name: Show dbt version
        run: dbt --version

      - name: Create CI profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          fintech:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: payments-512910
                dataset: ci_staging
                location: us-east1
                threads: 1
          EOF

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

  # Checks the Terraform in infra/ without touching Google Cloud: formatting, a provider install from the
  # committed lock file (which must already hold hashes for this runner, or init fails), and validate.
  # No credentials, no backend and no plan: a plan needs the state bucket, and an apply never runs in CI.
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Show the Terraform version
        run: terraform version

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialise without the backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate
