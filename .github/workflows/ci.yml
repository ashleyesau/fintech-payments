name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      PGPASSWORD: sim

    steps:
      - uses: actions/checkout@v4

      # Same flags as docker-compose.yml. A service container cannot take server flags, and
      # the CDC tests need wal_level=logical (they fail without it). The wait uses -h
      # localhost because the image's start-up runs a temporary server on the socket only.
      - name: Start Postgres with logical decoding
        run: |
          docker run -d --name fintech_pg -p 5432:5432 \
            -e POSTGRES_USER=sim -e POSTGRES_PASSWORD=sim -e POSTGRES_DB=fintech \
            postgres:16 postgres \
            -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4 \
            -c max_slot_wal_keep_size=3GB
          for i in $(seq 1 30); do
            docker exec fintech_pg pg_isready -h localhost -U sim -d fintech && exit 0
            sleep 2
          done
          docker logs fintech_pg
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply migrations
        run: |
          psql -h localhost -U sim -d fintech -f migrations/001_initial_schema.sql
          psql -h localhost -U sim -d fintech -f migrations/002_loan_repayments_fk.sql
          psql -h localhost -U sim -d fintech -f migrations/003_loan_applications_replica_identity.sql

      # The full suite, slow tests included. Locally -m "not slow" skips them.
      - name: Run tests
        run: python -m pytest tests/ -q
