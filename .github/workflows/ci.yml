name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Same credentials as docker-compose.yml. The service container cannot take
    # server flags, so wal_level stays at the default here; no test depends on it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sim
          POSTGRES_PASSWORD: sim
          POSTGRES_DB: fintech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sim -d fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: sim

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply migrations
        run: |
          psql -h localhost -U sim -d fintech -f migrations/001_initial_schema.sql
          psql -h localhost -U sim -d fintech -f migrations/002_loan_repayments_fk.sql

      # The full suite, slow tests included. Locally -m "not slow" skips them.
      - name: Run tests
        run: python -m pytest tests/ -q
