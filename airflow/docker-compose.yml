# Airflow 2.9.3 -- LocalExecutor
#
# Three long-running services: postgres (Airflow metadata), webserver, scheduler.
# A one-off init service bootstraps the database and creates the admin user.
#
# Prerequisites:
#   cp airflow/.env.example airflow/.env
#   fill in the three credential paths in airflow/.env
#
# First-time setup (run once):
#   docker compose -f airflow/docker-compose.yml up airflow-init
#
# Start:
#   docker compose -f airflow/docker-compose.yml up -d webserver scheduler
#
# UI: http://localhost:8080  username: admin  password: admin
#
# Trigger a run manually from the UI or:
#   docker compose -f airflow/docker-compose.yml exec scheduler \
#     airflow dags trigger fintech_pipeline
#
# Pause / unpause the cron schedule from the UI toggle, or:
#   docker compose -f airflow/docker-compose.yml exec scheduler \
#     airflow dags pause fintech_pipeline
#   docker compose -f airflow/docker-compose.yml exec scheduler \
#     airflow dags unpause fintech_pipeline

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme_in_env}
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
  volumes:
    - ../dags:/opt/airflow/dags
    - ..:/opt/repo
    - ${BRONZE_WRITER_CREDS_PATH}:/opt/credentials/bronze_writer.json:ro
    - ${ADC_CREDS_PATH}:/opt/credentials/adc.json:ro
    - ${DBT_PROFILES_DIR}:/home/airflow/.dbt:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Ashley \
          --lastname Esau \
          --role Admin \
          --email ashley.esau@gmail.com \
          --password admin
    restart: on-failure

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
