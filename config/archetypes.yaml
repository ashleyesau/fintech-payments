# hourly_weights: 24-element array (index 0 = midnight). Normalized at load time.
# monthly_seasonal_multipliers: 12 values Jan-Dec; 1.0 = annual average for this archetype.
# Sources: Simulator Design §3, Calibration Doc Areas 2-3.

