# Simulation calibration parameters.
# Sources: Calibration Doc Areas 2-4.
# All monetary amounts in ZAR cents (minor units) unless noted.

simulation:
  default_merchant_count: 1000
  start_date: "2025-01-01"
  end_date: "2026-01-01"
  streaming_speed_factor: 3600  # simulated seconds per real second

# S-curve onboarding ramp over the first 6 months.
# After month 6, onboarding runs at replacement rate only (churn offset).
onboarding_ramp:
  month_1_pct: 0.10
  month_2_pct: 0.18
  month_3_pct: 0.25
  month_4_pct: 0.20
  month_5_pct: 0.15
  month_6_pct: 0.12

# Share of onboarded merchants by archetype. Illustrative: no source document gives a
# mix. Chosen so the mix-weighted take rate stays inside its Validation bands (net sits
# close to the 1.4% ceiling, so tests/test_take_rate.py guards it) and the platform
# refund and churn rates land inside theirs.
archetype_mix:
  spaza_shop: 0.22
  restaurant: 0.12
  grocery: 0.10
  salon_low_cost: 0.08
  e_commerce: 0.12
  salon: 0.08
  seasonal_retail: 0.08
  liquor_store: 0.06
  wholesale: 0.06
  tutor: 0.05
  fuel_station: 0.03

# Day-of-month volume index (mid-month = 1.0 baseline).
# Encodes SASSA grant paydays (days 2-4), private sector payday (25th),
# PERSAL government salary (15th), and month-end patterns.
# Source: Calibration Doc Area 2.
daily_volume_index:
  1: 1.05
  2: 1.30
  3: 1.45
  4: 1.50
  5: 1.40
  6: 1.25
  7: 1.10
  8: 0.95
  9: 0.85
  10: 0.80
  11: 0.80
  12: 0.80
  13: 0.85
  14: 0.95
  15: 1.20
  16: 1.15
  17: 1.00
  18: 0.85
  19: 0.85
  20: 0.95
  21: 0.90
  22: 0.85
  23: 0.95
  24: 1.10
  25: 1.40
  26: 1.35
  27: 1.25
  28: 1.20
  29: 1.15
  30: 1.10
  31: 1.05

# Seasonal modifiers.
# january_tx_count_modifier and january_ticket_size_modifier are applied
# independently: more transactions AND smaller baskets in January.
# Source: Calibration Doc Area 3, Capitec 2025, BankservAfrica BETI.
seasonal:
  december_uplift: 1.30
  january_tx_count_modifier: 1.07
  january_ticket_size_modifier: 0.85
  # Dec 15, 22, 23 and 24 lift basket size for every archetype. Per Causal Rules this
  # is a ticket-size effect, not a transaction-count effect.
  december_peak_days: [15, 22, 23, 24]
  december_peak_ticket_multiplier: 1.25
  # Black Friday lifts basket size, not transaction count, and applies after the
  # saturation cap. Per Causal Rules only these archetypes are specified; any other
  # archetype uses the default. Revisit the default if Phase 8 shows flat Black Friday GPV.
  black_friday_ticket_multipliers:
    e_commerce: 2.50
    spaza_shop: 1.30
    restaurant: 1.10
  black_friday_ticket_default: 1.00
  saturation_cap: 2.50

# Merchant lifecycle.
# churn_multiplier scales every archetype's monthly_churn_prob in the dormancy hazard.
# Leave at 1.0 unless Phase 8 retention checks need tuning; activation (Phase 7) is the
# other lever for the retention targets.
lifecycle:
  churn_multiplier: 1.0

  # Activation. Illustrative values, set so the Validation Targets hold: 55-75% of
  # onboarded merchants transact within 7 days, median 2-5 days to first transaction,
  # logo retention 45-65% at M6 and 30-50% at M12. Retention is met by activation, not
  # churn: churn alone leaves about 81% at M6 and 65% at M12.
  activation_share: 0.67              # of onboarded merchants that ever transact
  activation_delay:
    within_7_days_share: 0.90         # of activators, first transaction inside a week
    day_weights: [0.16, 0.20, 0.24, 0.16, 0.12, 0.08, 0.04]  # days 1 to 7, sums to 1
    late_days: [8, 30]                # the rest, uniform over this inclusive range

  # A merchant that never transacts has no trading days, so the 30-day trading gate in
  # Chain 2 never opens for it. It becomes Churned this many days after onboarding.
  onboarding_abandonment_days: 30

  # Daily snapshots stop this many days after a merchant becomes Churned, unless it
  # still has an active loan. Keeps the Churned share near its 3-8% band.
  churned_snapshot_days: 30

# Geographic effects.
# Applied on top of archetype multipliers for qualifying province+archetype combos.
geographic:
  western_cape_summer_lift: 1.45        # Dec-Feb, tourism-linked archetypes
  western_cape_winter_dip: 0.70         # Jun-Aug, tourism-linked archetypes
  western_cape_summer_archetypes: [restaurant, salon, seasonal_retail, fuel_station]
  kzn_holiday_peak_months: [12, 4, 7]   # December, Easter month, July school holidays
  kzn_holiday_lift: 1.20
  township_sme_closure_rate: 0.65       # fraction closed during load shedding outages

# Load shedding damper.
# Set active: false for all V1 runs with start_date >= 2024-03-01. When active, every
# simulated day runs at `stage` with `hours_off_per_day` of outage; the damper is
# pro-rated as 1 - (1 - stage_multiplier) * hours_off / 24 (Calibration Doc Area 3).
load_shedding:
  active: false
  stage: 0
  hours_off_per_day: 4
  stage_multipliers:
    0: 1.00
    1: 0.98
    2: 0.97
    3: 0.93
    4: 0.88
    5: 0.82
    6: 0.77

# Quality percentile distribution drawn at merchant creation. Fixed for lifetime.
# Beta(1.5, 4.0): right-skewed, ~60% of merchants below archetype mean.
# Top decile runs at ~1.8-2.0x mean rate, producing ~35-40% of category GPV.
quality_tier:
  beta_a: 1.5
  beta_b: 4.0
