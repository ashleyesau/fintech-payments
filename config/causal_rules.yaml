# Causal rules parameters.
# Source: Causal Dependency Rules (Chains 2 to 5). Phase 4 and Phase 5 consume these values.
# Where a value is not specified in that document it is marked as such.

# Chain 2: merchant health state
state_transitions:
  # Trading days required before any transition is evaluated.
  min_trading_days: 30

  # Multiplier fed back into Chain 1 event intensity.
  stress_modifier:
    new: 1.00
    growing: 1.05
    stable: 1.00
    stressed: 0.80
    delinquent: 0.60
    churned: 0.00

  # GPV thresholds, as fractions.
  growth_threshold: 0.10            # gpv_mom_growth >= this counts as growing
  stable_band: 0.10                 # +/- this around zero counts as flat
  stressed_gpv_60d_decline: 0.20
  delinquent_gpv_60d_decline: 0.40
  stressed_recovery_band: 0.10      # within this of the prior 60-day baseline
  churn_no_txn_days: 30
  reactivation_min_months: 6

  # Evaluated once per day; one transition per cycle.
  # Priority when several conditions hold: churned > delinquent > stressed > growing > stable.
  priority: [churned, delinquent, stressed, growing, stable]

  # Consecutive months required before a transition condition is met.
  growing_to_stable_months: 2       # gpv_mom_growth < growth_threshold
  stable_to_growing_months: 2       # gpv_mom_growth >= growth_threshold

  # Probability that a met condition produces the transition over one 30-day window.
  # state.py converts each to a daily hazard, 1 - (1 - p) ** (1 / 30), so a condition
  # that holds for a month produces the transition with probability p. Rolled daily as
  # written, 0.65 is near-certain within a week and a seasonal GPV drop moved about 30%
  # of merchants in one week (Phase 8, state snapping). The one exception is
  # stressed_to_delinquent_missed_repayment: a single event rolled once, at p.
  probabilities:
    new_to_growing: 0.80            # months_on_platform >= 1
    new_to_stable: 0.70             # months_on_platform >= 3, growth inside stable_band
    growing_to_stable: 0.65
    growing_to_stressed: 0.60
    stable_to_growing: 0.75
    stable_to_stressed: 0.65
    stressed_to_delinquent_gpv: 0.70
    stressed_to_delinquent_missed_repayment: 0.90
    stressed_to_stable: 0.50
    delinquent_to_churned: 0.85
    # Not in Causal Rules. The table has no way out of New for a merchant that stops
    # trading before it has grown or stabilised, so it would stay New forever with zero
    # GPV. Same probability as delinquent_to_churned.
    new_to_churned: 0.85
    # Not in Causal Rules; see state.py. Delinquent to Stressed when GPV has recovered and
    # the merchant's loan is not in arrears.
    delinquent_to_stressed: 0.30

# Chain 3: lending eligibility gates
lending_eligibility:
  min_months_on_platform: 3
  min_gpv_90d_minor: 1500000        # R15,000 in cents
  eligible_states: [growing, stable]

# Chain 3: monthly application probability for eligible merchants
application_propensity:
  growing: 0.08
  stable: 0.04
  prior_loan_repaid_multiplier: 2.0

# Chain 3 and 4: loan approval decision bands (risk score at application time)
loan_approval:
  # 0-30: approved (automated)
  auto_approve_max: 30
  # 31-55: manual review
  manual_review_min: 31
  manual_review_max: 55
  # 56-75: counter-offer (60% of requested amount)
  counter_offer_min: 56
  counter_offer_max: 75
  counter_offer_ratio: 0.60
  # 76-100: declined (automated)
  auto_decline_min: 76

# Chain 3: DebiCheck collection parameters
debicheck:
  first_strike_base_success_rate: 0.77
  max_retries: 3
  retry_window_days: 10
  # Not in Causal Rules. Calibration Doc: 50% of first-strike failures recover inside the
  # 10-day window. Three retries at the first-strike rate would recover 99%, so each
  # retry uses its own, lower base rate: 1 - (1 - 0.2063) ** 3 = 0.50. State modifiers
  # apply to it as to the first strike.
  retry_attempt_success_rate: 0.2063
  # Days after the due date of retries 1 to 3, moved to business days. The largest shift
  # (weekend plus holiday Monday) keeps the last one inside the 10-day window.
  retry_day_offsets: [1, 4, 7]
  # Calibration Doc: DebiCheck dispute rate 0.3%. A disputed collection counts as unpaid
  # (response code MD06) and adds repayment_disputed_md06 to the risk score.
  dispute_rate: 0.003
  response_codes: {success: "00", insufficient_funds: "AM04", disputed: "MD06"}
  # Multiplier on first_strike_base_success_rate by merchant state at the due date.
  # New and churned are not specified: loans require growing or stable at
  # application, and a churned merchant is forced to miss (see forced_missed).
  state_modifiers:
    growing: 1.10
    stable: 1.00
    stressed: 0.70
    delinquent: 0.40

# Chain 3: forced missed-repayment triggers, independent of the DebiCheck draw.
forced_missed:
  gpv_30d_decline_from_disbursement: 0.50
  gpv_decline_p_increment: 0.30
  delinquent_p_increment: 0.50
  churned_p: 1.00
  # Not in Causal Rules. A merchant that goes dormant has stopped transacting with us, not
  # necessarily stopped repaying: this share closed their business and never pay again
  # (the "gone dark" case), the rest moved to another acquirer and keep servicing the loan
  # by DebiCheck from their bank account. 0.25 brings the write-off rate inside the
  # Validation Targets band; the other 75% repay as a merchant in good standing would.
  dormant_closure_share: 0.25

# Chain 4: DPD migration. Monthly transition probabilities by bucket.
dpd:
  write_off_dpd: 150
  transition_matrix:
    current:  {current: 0.94, dpd_1_30: 0.06}
    dpd_1_30: {current: 0.40, dpd_1_30: 0.30, dpd_31_60: 0.30}
    dpd_31_60: {current: 0.15, dpd_31_60: 0.25, dpd_61_90: 0.60}
    dpd_61_90: {current: 0.05, dpd_61_90: 0.15, dpd_90_plus: 0.80}
    dpd_90_plus: {dpd_61_90: 0.03, dpd_90_plus: 0.94, write_off: 0.03}
  # Stress scenario override.
  stress_roll_forward_multiplier: 1.4
  stress_cure_multiplier: 0.7

# Chain 4: risk score deltas and decay
risk_score:
  permanent_floor_written_off: 80
  deltas:
    repayment_successful: -2
    repayment_missed_nsf: 8
    repayment_disputed_md06: 15
    dpd_bucket_increase: 10         # per bucket
    dpd_bucket_cure: -5             # per bucket recovered
    loan_repaid_in_full: -10
    write_off: 50
    three_consecutive_successful: -5  # additional to the per-repayment delta
  decay:
    # Applied once per period with no adverse events. Floor is 0.
    period_days: 30
    points_per_period: 1
    # After this many consecutive days without adverse events, points_per_period is replaced.
    sustained_good_days: 90
    sustained_points_per_period: 3
    # Written-off merchants do not decay below permanent_floor_written_off.

# Chain 5: fraud triggers. Each fires a risk_events row and applies the delta.
fraud_triggers:
  refund_spike:
    refund_rate_7d_multiple_of_baseline: 3.0
    risk_score_delta: 10
  velocity_breach:
    sigma_above_archetype_mean: 3.0   # tx_count_1h > mean + 3 sigma
    risk_score_delta: 12
  chargeback_accumulation:
    chargeback_count_90d: 3
    risk_score_delta: 20
  scheme_warning:
    vamp_ratio: 0.015
    risk_score_delta: 25
  large_txn_flag:
    multiple_of_archetype_mean_ticket: 5.0
    risk_score_delta: 5
  otp_abuse:
    otp_failures_session: 3
    risk_score_delta: 8

# Chain 5: how the triggers are evaluated. Not in Causal Rules; these make the absolute
# thresholds above usable on a population with very different volumes.
risk_events:
  # Each rule fires at most once per merchant per day, and then not again for this many days.
  cooldown_days:
    refund_spike: 7
    velocity_breach: 1
    chargeback_accumulation: 90
    scheme_warning: 90
    large_txn_flag: 1
    otp_abuse: 1
  # A refund spike needs at least this many refunds in the 7 days.
  min_refunds_for_spike: 3
  # Ignore hours with fewer transactions than this; a mean of 0.1 per hour makes "mean
  # plus 3 sigma" a count of 2.
  velocity_min_count: 8
  # Causal Rules says mean plus 3 sigma. With about a dozen hourly looks a day and Poisson
  # tails that fires on 4% of merchant-days from noise alone (17 alerts a year per Spaza
  # merchant in a test run), and each alert adds 12 to a score that decays 1 a month.
  velocity_sigma: 5.0
  # The refund, chargeback and VAMP rules must also clear the count the archetype's
  # baseline predicts by this many Poisson standard deviations, so small baselines do not
  # trip on a handful of events.
  count_sigma: 4.0
  # Causal Rules says 3 chargebacks in 90 days. An E-commerce merchant expects about 10 in
  # 90 days, so a flat 3 would fire for every one of them. The count must also be this
  # multiple of what the archetype's fraud rate predicts.
  chargeback_baseline_multiple: 3.0
  # The VAMP ratio (chargebacks over completed card payments, 30 days) is only meaningful
  # with this many card payments.
  min_card_payments_for_vamp: 100
  # An OTP "session" is one merchant's one hour of EFT payments that fail at the OTP step.
  otp_session_hours: 1

# Fraud clusters: bursts of abnormal activity on one merchant (a compromised terminal, card
# testing, refund abuse). Not in Causal Rules; without them the Chain 5 triggers only ever
# fire on Poisson noise. The monthly start probability is the archetype fraud_rate times
# this factor, so E-commerce clusters most (1% a month, Spaza 0.1%). A cluster adds 60 to
# 100 risk points over the following months and the score decays 1 a month, so roughly
# 3 to 5% of merchants a year in the declined tier matches Validation Targets (3 to 8%).
fraud_cluster:
  monthly_start_probability_per_fraud_rate: 1.0
  duration_days: [2, 5]
  tx_count_multiplier: 3.0
  refund_probability_multiplier: 8.0
  chargeback_probability_multiplier: 10.0
  # Share of payments with an inflated ticket, as a multiple of the archetype mean ticket.
  large_ticket_share: 0.10
  large_ticket_multiple: [6.0, 10.0]
  # Share of EFT attempts that get through the OTP step (normal: 0.85).
  otp_entered_rate: 0.35
  # Transaction risk score range for payments in a cluster.
  risk_score_range: [60, 95]

# Chain 5: escalation after a refund spike.
fraud_escalation:
  manual_review_risk_score_above: 55
  chargeback_followup_days: 30
  chargeback_followup_delta: 20
  stable_to_stressed_on_followup: true
