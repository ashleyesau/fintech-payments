version: 2

models:
  - name: stg_merchants
    description: >
      Daily end-of-day merchant dimension snapshots. One row per merchant per simulated day.
      Feeds the merchants_scd SCD2 snapshot in S3.
    columns:
      - name: merchant_id
        tests:
          - not_null
      - name: snapshot_at
        tests:
          - not_null
      - name: merchant_state
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'growing', 'stable', 'stressed', 'delinquent', 'churned']
      - name: risk_score
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null

  - name: stg_merchant_transactions
    description: >
      Payment event stream. One row per payment attempt (completed, refunded, or charged back).
      Primary key is transaction_id.
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: merchant_id
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['payment', 'refund', 'chargeback', 'void']
      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: ['card_present', 'card_ecom', 'instant_eft', 'payment_link', 'payshap']
      - name: amount_minor
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null

  - name: stg_loan_applications
    description: >
      Loan applications deduped to the latest row per application_id
      by (commit_lsn DESC, transaction_position DESC). disbursed_at and
      disbursement_amount_minor are null for applications that were not disbursed.
    columns:
      - name: application_id
        tests:
          - not_null
          - unique
      - name: merchant_id
        tests:
          - not_null
      - name: submission_ts
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null

  - name: stg_loan_repayments
    description: >
      Loan repayment collection events. One row per collection attempt.
      Retries, cures and write-offs each produce a new row.
    columns:
      - name: repayment_id
        tests:
          - not_null
          - unique
      - name: loan_id
        tests:
          - not_null
      - name: merchant_id
        tests:
          - not_null
      - name: par_bucket
        tests:
          - not_null
          - accepted_values:
              values: ['current', '1-30', '31-60', '61-90', '90+']
      - name: collection_status
        tests:
          - not_null
          - accepted_values:
              values:
                - success
                - unpaid_nsf
                - unpaid_account_closed
                - unpaid_no_authority
                - disputed
                - reversed
                - partial
      - name: event_date
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null

  - name: stg_risk_events
    description: >
      Fraud and risk alert stream. One row per rule firing.
      resolved_ts and outcome are always null in the current dataset.
    columns:
      - name: alert_id
        tests:
          - not_null
          - unique
      - name: merchant_id
        tests:
          - not_null
      - name: rule_type
        tests:
          - not_null
          - accepted_values:
              values:
                - refund_spike
                - velocity_breach
                - chargeback_accumulation
                - scheme_warning
                - large_txn_flag
                - otp_abuse
      - name: action
        tests:
          - not_null
          - accepted_values:
              values: ['allow', 'flag_review', 'block']
      - name: event_date
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null
