version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: fintech_pg
    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: sim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=4
      -c max_wal_senders=4

volumes:
  postgres_data:
